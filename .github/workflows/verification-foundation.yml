name: Forecast Journey verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: Unit, build, interaction, accessibility, and capture matrix
        run: npm run test:ci
        env:
          CI: '1'
      - name: Generate comparison candidates
        if: always()
        run: npm run test:visual:capture
        env:
          CI: '1'
          VISUAL_COMPARE: '1'
      - name: Upload captures and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: forecast-journey-verification-${{ github.run_id }}
          path: |
            artifacts/
            tests/e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: 30
