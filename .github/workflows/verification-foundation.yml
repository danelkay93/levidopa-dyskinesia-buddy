name: Verification foundation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  webkit-verification:
    name: WebKit capture and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install verification dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright WebKit and system dependencies
        run: npx playwright install --with-deps webkit

      - name: Run viewport, state, and axe capture matrix
        run: npm run test:ci
        env:
          CI: '1'
          AXE_ENFORCE: '0'
          VISUAL_COMPARE: '0'

      - name: Generate unapproved visual-comparison candidates
        run: npx playwright test tests/e2e/visual-comparison.spec.ts --update-snapshots --reporter=list
        env:
          CI: '1'
          VISUAL_COMPARE: '1'

      - name: Upload screenshots and machine-readable reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-captures-${{ github.run_id }}
          path: |
            artifacts/screenshots/
            artifacts/metrics/
            artifacts/accessibility/
            artifacts/browser/
            artifacts/reports/
            artifacts/test-results/
            tests/e2e/__screenshots__/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: artifacts/playwright-report/
          if-no-files-found: warn
          retention-days: 30
